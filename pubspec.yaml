name: vixago_player
description: Vixago Player - reproductor de música y video.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  http: ^1.6.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/icon/logo_full.png

# Ícono de la app. El workflow ejecuta: dart run flutter_launcher_icons
# En Android 8+ es un ícono adaptable (símbolo + fondo) que cada marca recorta a su forma.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 24

# Pantalla de arranque. El workflow ejecuta: dart run flutter_native_splash:create
# Android 12+ solo permite un ícono redondo: ahí va el símbolo; antes, el logo completo con texto.
flutter_native_splash:
  color: "#05091C"
  image: assets/icon/logo_full.png
  android_12:
    color: "#05091C"
    image: assets/icon/foreground.png
    icon_background_color: "#05091C"
  ios: false
  web: false
